name: VL Achados Bot

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  rodar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: pip install requests gspread google-auth python-dotenv

      - name: Criar credenciais.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      - name: Rodar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
